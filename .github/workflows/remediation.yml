name: Remediation PR (manual, gated)

# Opens ONE draft remediation PR in a project repository (docs/engineering.md#execute,
# docs/verification.md#remediation). Off by default. It writes only when all of these hold:
#   - a person starts it by hand (there is no schedule and no other trigger),
#   - it runs from main, so the code holding the token is code the owner merged,
#   - the repository variable REMEDIATION_WRITE_ENABLED is 'true',
#   - the confirm input is typed exactly, and
#   - the REMEDIATION_TOKEN secret is a fine-grained token scoped to the target repository with
#     contents and pull-requests write only.
# Two sources:
#   issue + digest  (Phase 5) the proposal is prepared again in a step that holds no token, and the
#                   PR is opened only if its digest equals the digest the owner reviewed in the
#                   prepare artifact and no remediation PR already covers the issue.
#   plan            (Phase 4) a reviewed plan file committed under verification/remediation/.
# The code refuses merges, approvals, deletions, existing branches, protected refs, protected
# repositories (ModsPack) and workflow files whatever the input says (scripts/verify/remediation.mjs).
on:
  workflow_dispatch:
    inputs:
      issue:
        description: 'Phase 5: issue id from reports/engineering/queue.md (for example taskforge:advisory:high-production)'
        required: false
        default: ''
      digest:
        description: 'Phase 5: sha256 digest of the proposal you reviewed (prepare artifact)'
        required: false
        default: ''
      plan:
        description: 'Phase 4: path of a reviewed plan JSON (verification/remediation/<name>.json)'
        required: false
        default: ''
      repository:
        description: 'Phase 4: target repository URL (must match the plan)'
        required: false
        default: ''
      confirm:
        description: 'Type: create one draft remediation PR'
        required: true

permissions: {}

concurrency:
  group: remediation
  cancel-in-progress: false

jobs:
  open-draft-pr:
    if: github.ref == 'refs/heads/main' && vars.REMEDIATION_WRITE_ENABLED == 'true' && inputs.confirm == 'create one draft remediation PR'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: inputs.issue != ''
        with:
          path: |
            engineering/state.json
            verification/evidence/
            verification/runs/
          key: engineering-state-${{ github.run_id }}
          restore-keys: engineering-state-
      - name: Prepare the proposal again (no token in this step; no project code runs)
        if: inputs.issue != ''
        env:
          ISSUE: ${{ inputs.issue }}
        run: |
          set -euo pipefail
          case "$ISSUE" in *[!a-z0-9:+-]*) echo "issue id has unexpected characters"; exit 1 ;; esac
          project="${ISSUE%%:*}"
          node scripts/engineering/cli.mjs prepare --project "$project" --out "$RUNNER_TEMP/proposals" --work "$RUNNER_TEMP/work"
      - name: Open the draft PR
        env:
          REMEDIATION_TOKEN: ${{ secrets.REMEDIATION_TOKEN }}
          REMEDIATION_WRITE_ENABLED: ${{ vars.REMEDIATION_WRITE_ENABLED }}
          ISSUE: ${{ inputs.issue }}
          DIGEST: ${{ inputs.digest }}
          PLAN: ${{ inputs.plan }}
          TARGET: ${{ inputs.repository }}
        run: |
          set -euo pipefail
          if [ -n "$ISSUE" ]; then
            file="$RUNNER_TEMP/proposals/$(printf '%s' "$ISSUE" | tr ':' '-').json"
            node scripts/engineering/cli.mjs execute --proposal "$file" --digest "$DIGEST" --confirm
          else
            case "$PLAN" in *..*) echo "plan path must not contain .."; exit 1 ;; verification/remediation/*.json) ;; *) echo "plan must be under verification/remediation/"; exit 1 ;; esac
            node scripts/verify/cli.mjs remediate --plan "$PLAN" --repository "$TARGET" --confirm
          fi
