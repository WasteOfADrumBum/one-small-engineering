name: Engineering orchestrator

# One Small Engineering's single monitoring workflow (docs/engineering.md): sync live revisions,
# collect changed evidence, verify, evaluate readiness, prioritize, report. Read-only everywhere.
#
#   schedule           every six hours: OBSERVE only. No project code runs, nothing is written to
#                      any repository, and no job here has a write permission.
#   workflow_dispatch  manual: observe (optionally running project builds and tests in a separate
#                      job that holds no secret), or prepare (candidate fixes as artifacts only).
#
# Pull requests no longer trigger this workflow (2026-11-05, docs/ci-cd.md): the orchestrator's
# tests, including a local-server integration suite, run in the merge gate (validate.yml), and a
# live observe run after merge is a manual dispatch from main.
#
# Opening a remediation PR is a different workflow (remediation.yml) with its own token, run by a
# person from main. State between scheduled runs is kept in the Actions cache (main only); every
# run uploads its reports, state and evidence as an artifact for 30 days.
on:
  schedule:
    - cron: '17 */6 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'observe (monitor and report) or prepare (candidate fixes as artifacts; nothing is written)'
        type: choice
        options: [observe, prepare]
        default: observe
      project:
        description: 'Project ID (blank for all eight)'
        required: false
        default: ''
      execute:
        description: 'Run project build and test commands first (isolated job, no secrets)'
        type: boolean
        default: false

# Nothing unless a job asks for it.
permissions: {}

# One run at a time per ref, queued rather than cancelled, so two runs never interleave state.
concurrency:
  group: engineering-${{ github.ref }}
  cancel-in-progress: false

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - name: Registry, orchestrator and regression tests
        run: npm run check

  execute:
    # Manual only. Untrusted project code (npm ci, build, test) runs here, in a job with no secret,
    # no API token in its environment and read-only contents permission, as a separate sandbox user
    # whose leftover processes are killed after every command (scripts/ci/sandbox-setup.sh), so it
    # cannot reach the later artifact and cache steps' runtime token. Its evidence is handed to the
    # observe job as an artifact.
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.execute
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            engineering/state.json
            verification/evidence/
            verification/runs/
          key: engineering-state-${{ github.run_id }}
          restore-keys: engineering-state-
      - name: Create the project-code sandbox user
        run: bash scripts/ci/sandbox-setup.sh
      - name: Build and test projects (no API, no secrets, sandbox user)
        env:
          ENGINEERING_PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          args=(check --execute --no-api --work "$ONE_SMALL_WORK")
          if [ -n "${ENGINEERING_PROJECT:-}" ]; then args+=(--project "$ENGINEERING_PROJECT"); fi
          node scripts/engineering/cli.mjs "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: engineering-execute-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            engineering/state.json
            verification/evidence/
            verification/runs/
          retention-days: 7
          if-no-files-found: error

  observe:
    needs: [tests, execute]
    if: always() && needs.tests.result == 'success' && needs.execute.result != 'failure' && (github.event_name != 'workflow_dispatch' || inputs.mode == 'observe')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
      checks: read
      pull-requests: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            engineering/state.json
            verification/evidence/
            verification/runs/
          key: engineering-state-${{ github.run_id }}
          restore-keys: engineering-state-
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333
        if: needs.execute.result == 'success'
        with:
          name: engineering-execute-${{ github.run_id }}-${{ github.run_attempt }}
          path: .
      - name: Observe all projects (read-only)
        env:
          GITHUB_TOKEN: ${{ github.token }}
          # Schedule and manual dispatch only (no pull_request trigger), so the reader is never given to PR code.
          SYNC_READER_TOKEN: ${{ secrets.SYNC_READER_TOKEN }}
          ENGINEERING_PROJECT: ${{ inputs.project }}
        run: |
          set -euo pipefail
          args=(check --work "$RUNNER_TEMP/work")
          if [ -n "${ENGINEERING_PROJECT:-}" ]; then args+=(--project "$ENGINEERING_PROJECT"); fi
          node scripts/engineering/cli.mjs "${args[@]}" | tee "$RUNNER_TEMP/observe.log"
      - name: Reports are reproducible from the recorded state
        run: node scripts/engineering/cli.mjs report --check
      - name: Log the dashboard
        if: always()
        run: |
          grep '^engineering:' "$RUNNER_TEMP/observe.log" || true
          if [ -f reports/engineering/dashboard.md ]; then cat reports/engineering/dashboard.md; fi
      - uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        with:
          path: |
            engineering/state.json
            verification/evidence/
            verification/runs/
          key: engineering-state-${{ github.run_id }}
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: engineering-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            reports/engineering/
            reports/verification/
            engineering/state.json
            verification/evidence/
            verification/runs/
          retention-days: 30
          if-no-files-found: warn

  prepare:
    # Manual only. Candidate fixes become artifacts with digests for review. No token can write:
    # the job has read-only contents permission and no secret.
    needs: tests
    if: github.event_name == 'workflow_dispatch' && inputs.mode == 'prepare'
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 24
      - uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9
        if: github.ref == 'refs/heads/main'
        with:
          path: |
            engineering/state.json
            verification/evidence/
            verification/runs/
          key: engineering-state-${{ github.run_id }}
          restore-keys: engineering-state-
      - name: Create the project-code sandbox user
        run: bash scripts/ci/sandbox-setup.sh
      - name: Prepare candidate fixes (nothing is written to GitHub)
        env:
          ENGINEERING_PROJECT: ${{ inputs.project }}
          ENGINEERING_EXECUTE: ${{ inputs.execute }}
        run: |
          set -euo pipefail
          args=(prepare --out "$RUNNER_TEMP/proposals" --work "$ONE_SMALL_WORK")
          if [ -n "${ENGINEERING_PROJECT:-}" ]; then args+=(--project "$ENGINEERING_PROJECT"); fi
          if [ "${ENGINEERING_EXECUTE}" = "true" ]; then args+=(--execute); fi
          node scripts/engineering/cli.mjs "${args[@]}"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        if: always()
        with:
          name: engineering-proposals-${{ github.run_id }}-${{ github.run_attempt }}
          path: ${{ runner.temp }}/proposals/
          retention-days: 30
          if-no-files-found: warn
