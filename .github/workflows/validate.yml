name: Validate registry

on:
  pull_request:
  push:
    branches: [main]

# Read-only: the job checks files and never writes to the repository.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions pinned to commit SHAs (v4.3.1 and v4.4.0).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      # No dependencies to install: the validator uses only Node built-ins.
      - name: Validate registry and run validator tests
        run: npm run check
