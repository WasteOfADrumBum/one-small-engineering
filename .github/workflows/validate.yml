name: Validate registry

on:
  pull_request:
  push:
    branches: [main]
  # Registry sync dispatches this on its sync/* branches, because PRs opened with
  # GITHUB_TOKEN do not trigger pull_request workflows.
  workflow_dispatch:

# Read-only: the job checks files and never writes to the repository.
permissions:
  contents: read

concurrency:
  group: validate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      # Actions pinned to commit SHAs (v4.3.1 and v4.4.0).
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
          # Full history so the sync guard can diff against main.
          fetch-depth: 0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      # No dependencies to install: the validator uses only Node built-ins.
      - name: Validate registry and run validator tests
        run: npm run check
      # On sync/* branches: only automation-owned fields of that branch's project may change.
      - name: Sync branch guard
        if: startsWith(github.head_ref || github.ref_name, 'sync/')
        env:
          SYNC_BRANCH: ${{ github.head_ref || github.ref_name }}
        run: node scripts/sync/guard.mjs --base origin/main --branch "$SYNC_BRANCH"
      # TEMPORARY (removed in the next commit): read-only first-run access checks with this
      # job's own GITHUB_TOKEN (contents: read). No writes; status codes only.
      - name: Access probe (temporary)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync/access-probe.mjs
      - name: Real collect and dry run with GITHUB_TOKEN (temporary)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: |
          node scripts/sync/run.mjs collect --out out/probe/observations.json
          node scripts/sync/run.mjs write --mode dry-run --in out/probe/observations.json --out-dir out/probe
          cat out/probe/STATUS.md >> "$GITHUB_STEP_SUMMARY"
      - name: Real main integrity window scan with GITHUB_TOKEN (temporary)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_EVENT_NAME: workflow_dispatch
        run: node scripts/sync/main-integrity.mjs

  # TEMPORARY (removed in the next commit): the same read-only probe with exactly the read
  # scopes the integrity and sync jobs use, never a write scope.
  access-probe-read-scopes:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
      pull-requests: read
      issues: read
      actions: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Access probe
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync/access-probe.mjs
      - name: Real main integrity window scan
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: node scripts/sync/main-integrity.mjs
