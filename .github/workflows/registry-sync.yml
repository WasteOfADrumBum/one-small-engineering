name: Registry sync

# Hub-pull reconciliation. Reads every sync-enabled project from GitHub's API and opens
# or refreshes one draft PR per project when something material changed. Deterministic:
# no AI calls and no project code. See docs/sync.md.
#
# Staged activation (scripts/sync/stage.mjs, docs/sync-setup.md), set by the repository
# variable SYNC_STAGE:
#   A (unset)  read-only. Manual runs only; the report job holds no write permission and
#              the report goes to the job summary. Scheduled runs are skipped.
#   B          manual runs may open draft sync PRs here and update the status issue.
#   C          the six-hour schedule runs too, with writes.
# The Phase 1 variable SYNC_WRITE_ENABLED=true still means stage C.
on:
  schedule:
    - cron: '23 */6 * * *'
  workflow_dispatch:
    inputs:
      project:
        description: 'Project ID to sync (blank for all sync-enabled projects)'
        required: false
        default: ''
      dry_run:
        description: 'Dry run: report only, no branches or PRs'
        type: boolean
        default: true

# GITHUB_TOKEN gets nothing unless a job asks for it.
permissions: {}

# One sync at a time; a queued run waits rather than cancelling one that may be writing.
concurrency:
  group: registry-sync
  cancel-in-progress: false

jobs:
  collect:
    # Read-only. Public project repositories are read with this job's token; a private
    # project needs the optional read-only reader credential (docs/sync-setup.md).
    # A scheduled run does nothing before stage C.
    if: github.event_name != 'schedule' || vars.SYNC_STAGE == 'C' || (vars.SYNC_STAGE == '' && vars.SYNC_WRITE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    outputs:
      observations: ${{ steps.collect.outputs.observations }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - id: collect
        name: Collect observations
        env:
          GITHUB_TOKEN: ${{ github.token }}
          READER_TOKEN: ${{ secrets.SYNC_READER_TOKEN }}
          SYNC_PROJECT: ${{ inputs.project }}
        run: node scripts/sync/run.mjs collect

  report:
    # Stage A: plan, guard and validate with no write permission at all. The report is the
    # job summary; nothing is written to GitHub.
    needs: collect
    if: vars.SYNC_STAGE != 'B' && vars.SYNC_STAGE != 'C' && !(vars.SYNC_STAGE == '' && vars.SYNC_WRITE_ENABLED == 'true')
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Plan, guard and validate (read-only)
        env:
          SYNC_OBSERVATIONS: ${{ needs.collect.outputs.observations }}
          SYNC_PROJECT: ${{ inputs.project }}
          # Checked so an unknown stage fails loudly; --read-only keeps this job a dry run whatever it says.
          SYNC_STAGE: ${{ vars.SYNC_STAGE }}
          SYNC_WRITE_ENABLED: ${{ vars.SYNC_WRITE_ENABLED }}
          SYNC_DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: node scripts/sync/run.mjs write --mode auto --read-only

  write:
    # Stages B and C. Runs only from main, so the code holding write permission is code the
    # owner merged.
    needs: collect
    if: github.ref == 'refs/heads/main' && (vars.SYNC_STAGE == 'B' || vars.SYNC_STAGE == 'C' || (vars.SYNC_STAGE == '' && vars.SYNC_WRITE_ENABLED == 'true'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write        # push sync/* branches only (enforced in scripts/sync/write.mjs)
      pull-requests: write   # draft PRs into main
      issues: write          # the single "Registry sync status" issue
      actions: write         # dispatch Validate registry on sync branches
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - name: Plan, guard, validate and write
        env:
          GITHUB_TOKEN: ${{ github.token }}
          SYNC_OBSERVATIONS: ${{ needs.collect.outputs.observations }}
          # The same project filter as collect, so the writer knows which projects to expect.
          SYNC_PROJECT: ${{ inputs.project }}
          # The stage decides the mode (scripts/sync/stage.mjs); an unknown stage fails the run.
          SYNC_STAGE: ${{ vars.SYNC_STAGE }}
          SYNC_WRITE_ENABLED: ${{ vars.SYNC_WRITE_ENABLED }}
          SYNC_DRY_RUN_INPUT: ${{ inputs.dry_run }}
        run: node scripts/sync/run.mjs write --mode auto
      # Validate registry runs on the sync branches (dispatched above); runs started by a GITHUB_TOKEN dispatch
      # do not chain further workflows, so ask Auto-merge to evaluate now. It waits for the checks.
      - name: Request auto-merge evaluation
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
        run: gh api -X POST "repos/$REPO/actions/workflows/automerge.yml/dispatches" -f ref=main -f 'inputs[dry_run]=false' || echo "::warning::could not dispatch auto-merge; its schedule will pick the PRs up"
