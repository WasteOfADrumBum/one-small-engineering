name: Verify projects

# Automated evidence collection and readiness regeneration (docs/verification.md).
# Read-only everywhere: no job here can push, open PRs, comment, approve or merge. Collected
# evidence and regenerated reports are uploaded as artifacts; committing them is a human PR.
#
#   workflow_dispatch  manual run: pick a project (or all) and whether to execute project code
#   (no schedule)      scheduled monitoring moved to engineering.yml (every six hours, incremental),
#                      so evidence is not collected twice
#
# Pull requests no longer trigger this workflow (2026-11-05, docs/ci-cd.md). It ran every project's
# build and tests (6 to 18 minutes) on every registry change, in a job whose parent process held the
# job token; the verification tests run in the merge gate (validate.yml) instead.
on:
  workflow_dispatch:
    inputs:
      project:
        description: 'Project ID (blank for all eight)'
        required: false
        default: ''
      execute:
        description: 'Run project build and test commands (isolated job, no credentials)'
        type: boolean
        default: true

# Nothing unless a job asks for it.
permissions: {}

concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Verification unit, fixture and adversarial tests
        run: node --test scripts/verify/*.test.mjs

  collect:
    # Untrusted project code (npm ci, build, test) runs here. The job token can only read this
    # repository and is not persisted to disk. scripts/verify/exec.mjs runs project commands as a
    # separate sandbox user with an allowlisted environment and kills whatever they leave behind,
    # so they cannot read the token from this process or a later step (scripts/ci/sandbox-setup.sh).
    # The CI-results collector uses the token for read-only API calls only.
    needs: tests
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
      checks: read
      actions: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: 22
      - name: Create the project-code sandbox user
        run: bash scripts/ci/sandbox-setup.sh
      - name: Collect evidence
        env:
          GITHUB_TOKEN: ${{ github.token }}
          VERIFY_PROJECT: ${{ inputs.project }}
          VERIFY_EXECUTE: ${{ inputs.execute }}
        run: |
          set -euo pipefail
          args=(run --work "$ONE_SMALL_WORK")
          if [ -n "${VERIFY_PROJECT:-}" ]; then args+=(--project "$VERIFY_PROJECT"); fi
          if [ "$VERIFY_EXECUTE" = "true" ]; then args+=(--execute); fi
          node scripts/verify/cli.mjs "${args[@]}" | tee "$RUNNER_TEMP/collect.log"
      - name: Evidence freshness
        run: node scripts/verify/cli.mjs freshness | tee -a "$RUNNER_TEMP/collect.log"
      - name: Failure summary
        if: always()
        run: |
          {
            echo '## Verification run'
            echo
            if [ -f reports/verification/dashboard.md ]; then sed -n '1,40p' reports/verification/dashboard.md; else echo 'No dashboard was produced; see the job log.'; fi
            echo
            echo '### Collector results'
            echo
            echo '```text'
            grep '^verify:' "$RUNNER_TEMP/collect.log" || true
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: Upload evidence and reports
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9
        with:
          name: verification-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            verification/evidence/
            verification/runs/
            reports/verification/
          retention-days: 30
          if-no-files-found: warn
