name: Project events

# Event-driven refresh (docs/event-sync.md). A project repository sends repository_dispatch
# "onesmall-project-event" when a PR, push, CI run, release or tag changes. This workflow
# checks the sender and repository (scripts/sync/events.mjs), then dispatches the existing
# Registry sync, which rereads real GitHub state; the payload never reaches the registry.
# The six-hour Registry sync schedule remains the fallback for any event that never arrives.
on:
  repository_dispatch:
    types: [onesmall-project-event]

permissions: {}

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      accepted: ${{ steps.check.outputs.accepted }}
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 22
      - id: check
        name: Check sender, repository and event
        env:
          EVENT_ACTOR: ${{ github.actor }}
          EVENT_PAYLOAD: ${{ toJSON(github.event.client_payload) }}
        run: |
          if node scripts/sync/events.mjs; then echo "accepted=true" >> "$GITHUB_OUTPUT"; else echo "accepted=false" >> "$GITHUB_OUTPUT"; exit 1; fi

  sync:
    # Always a full sync: a queued Registry sync run then covers every project, so bursts
    # and out-of-order events coalesce without losing one (Registry sync queues one pending run).
    needs: verify
    if: needs.verify.outputs.accepted == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: write   # dispatch Registry sync only
    steps:
      - name: Dispatch Registry sync
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          REF: ${{ github.event.repository.default_branch }}
        run: gh api -X POST "repos/$REPO/actions/workflows/registry-sync.yml/dispatches" -f ref="$REF" -f 'inputs[dry_run]=false'
