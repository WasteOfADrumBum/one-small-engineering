# one-small-report template v1. Generated by WasteOfADrumBum/one-small-engineering (npm run onboard); regenerate rather than edit.
name: One Small Engineering config

# Checks .github/one-small-engineering.json in this repository's own CI. It needs no
# secrets and cannot write anywhere. The hub reads this repository through GitHub's API
# on its own schedule; nothing here sends data to the hub.
on:
  pull_request:
    paths:
      - .github/one-small-engineering.json
      - .github/workflows/one-small-report.yml
  push:
    branches: [__DEFAULT_BRANCH__]
    paths:
      - .github/one-small-engineering.json
      - .github/workflows/one-small-report.yml

permissions:
  contents: read

jobs:
  check-config:
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          persist-credentials: false
      - name: Validate .github/one-small-engineering.json
        run: |
          node --input-type=module -e '
          import { readFileSync } from "node:fs"
          const fail = m => { console.error(`::error file=.github/one-small-engineering.json::${m}`); process.exit(1) }
          let c
          try { c = JSON.parse(readFileSync(".github/one-small-engineering.json", "utf8")) } catch (e) { fail(`not valid JSON: ${e.message}`) }
          const top = new Set(["$schema", "configVersion", "projectId", "registry", "reporting"])
          const rep = new Set(["enabled", "workflows", "includeDraftPullRequests", "releaseTagPattern", "evidenceLabel", "materialPaths", "lookbackDays"])
          for (const k of Object.keys(c)) if (!top.has(k)) fail(`unknown key ${k}`)
          for (const k of Object.keys(c.reporting || {})) if (!rep.has(k)) fail(`unknown key reporting.${k}`)
          if (c.configVersion !== 1) fail("configVersion must be 1")
          if (!/^[a-z0-9]+(?:-[a-z0-9]+)*$/.test(c.projectId || "")) fail("projectId must be a lowercase slug")
          if (c.registry !== undefined && c.registry !== "WasteOfADrumBum/one-small-engineering") fail("registry must be WasteOfADrumBum/one-small-engineering")
          if (c.reporting && c.reporting.releaseTagPattern) { try { new RegExp(c.reporting.releaseTagPattern) } catch { fail("releaseTagPattern is not a valid regular expression") } }
          console.log(`One Small Engineering config OK for ${c.projectId}; the hub performs the full check.`)
          '
